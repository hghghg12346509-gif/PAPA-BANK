<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Папа Банк - Умный учет</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef2f5;
            --primary: #4361ee;
            --plus-color: #2ecc71;
            --minus-color: #e74c3c;
            --text-color: #2b2d42;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            padding: 30px;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            padding: 15px;
            text-align: left;
            font-size: 16px;
        }

        th:nth-child(1) { width: 25%; }
        th:nth-child(2) { width: 15%; }
        th:nth-child(3) { width: 15%; }
        th:nth-child(4) { width: 45%; }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            background: white;
            transition: background 0.2s;
        }

        /* Стили для редактирования */
        td[contenteditable="true"]:focus {
            outline: none;
            background-color: #f0f8ff;
            box-shadow: inset 0 0 5px rgba(67, 97, 238, 0.3);
        }

        /* Цвета для плюсов и минусов */
        td.income-text { color: var(--plus-color); }
        td.expense-text { color: var(--minus-color); }

        /* Подсветка строки при наведении */
        tr:hover td {
            background-color: #f9f9f9;
        }
        
        /* Убираем стрелочки у инпутов чисел */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(67, 97, 238, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.danger {
            background: #ff4757;
            box-shadow: 0 4px 6px rgba(255, 71, 87, 0.3);
        }

        .btn.danger:hover {
            box-shadow: 0 6px 12px rgba(255, 71, 87, 0.4);
        }

        /* Блок с итогами */
        .totals {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 2px dashed #dcdcdc;
        }

        .total-item {
            text-align: center;
        }

        .total-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .total-value {
            font-size: 28px;
            font-weight: 800;
        }

        .value-plus { color: var(--plus-color); }
        .value-minus { color: var(--minus-color); }
        .value-balance { color: var(--primary); }

    </style>
</head>
<body>

    <div class="container">
        <h1>Папа Банк</h1>

        <table id="bankTable">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>+</th>
                    <th>-</th>
                    <th>Комментарий</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Строки будут добавляться через JavaScript -->
            </tbody>
        </table>

        <div class="controls">
            <button class="btn" onclick="addRow()">➕ Добавить строку</button>
            <button class="btn danger" onclick="clearTable()">🗑️ Очистить всё</button>
        </div>

        <div class="totals">
            <div class="total-item">
                <div class="total-label">Доходы (+)</div>
                <div class="total-value value-plus" id="total-income">0</div>
            </div>
            <div class="total-item">
                <div class="total-label">Расходы (-)</div>
                <div class="total-value value-minus" id="total-expense">0</div>
            </div>
            <div class="total-item">
                <div class="total-label">Остаток</div>
                <div class="total-value value-balance" id="total-balance">0</div>
            </div>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('table-body');

        // Функция создания одной пустой строки
        function createRow(data = { date: '', income: '', expense: '', comment: '' }) {
            const tr = document.createElement('tr');
            
            // Ячейка Дата
            const tdDate = document.createElement('td');
            tdDate.contentEditable = "true";
            tdDate.textContent = data.date;
            
            // Ячейка Доход (+)
            const tdIncome = document.createElement('td');
            tdIncome.contentEditable = "true";
            tdIncome.textContent = data.income;
            tdIncome.classList.add('income-text');
            
            // Ячейка Расход (-)
            const tdExpense = document.createElement('td');
            tdExpense.contentEditable = "true";
            tdExpense.textContent = data.expense;
            tdExpense.classList.add('expense-text');
            
            // Ячейка Комментарий
            const tdComment = document.createElement('td');
            tdComment.contentEditable = "true";
            tdComment.textContent = data.comment;

            // Собираем строку
            tr.appendChild(tdDate);
            tr.appendChild(tdIncome);
            tr.appendChild(tdExpense);
            tr.appendChild(tdComment);

            // Добавляем обработчики событий для пересчета при вводе текста
            tdIncome.addEventListener('input', calculateTotals);
            tdExpense.addEventListener('input', calculateTotals);

            tableBody.appendChild(tr);
        }

        // Добавить новую строку вручную (кнопка)
        function addRow() {
            createRow();
            saveData();
        }

        // Очистить всю таблицу
        function clearTable() {
            if (confirm("Ты точно хочешь удалить все записи? Это действие нельзя отменить!")) {
                tableBody.innerHTML = '';
                addRow(); // Добавляем одну пустую для красоты
                saveData();
            }
        }

        // Функция подсчета итогов
        function calculateTotals() {
            let totalIncome = 0;
            let totalExpense = 0;

            // Проходимся по всем строкам таблицы
            const rows = tableBody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const incomeCell = row.cells[1];
                const expenseCell = row.cells[2];

                // Парсим числа, если там текст - считаем как 0
                const incomeVal = parseFloat(incomeCell.textContent) || 0;
                const expenseVal = parseFloat(expenseCell.textContent) || 0;

                totalIncome += incomeVal;
                totalExpense += expenseVal;
            });

            const balance = totalIncome - totalExpense;

            // Выводим на экран
            document.getElementById('total-income').textContent = totalIncome;
            document.getElementById('total-expense').textContent = totalExpense;
            document.getElementById('total-balance').textContent = balance;

            // Красим остаток в красный, если ушли в минус
            const balanceEl = document.getElementById('total-balance');
            if (balance < 0) {
                balanceEl.classList.add('value-minus');
                balanceEl.classList.remove('value-balance');
            } else {
                balanceEl.classList.add('value-balance');
                balanceEl.classList.remove('value-minus');
            }

            // Сохраняем данные при каждом изменении
            saveData();
        }

        // --- СОХРАНЕНИЕ ДАННЫХ В ПАМЯТЬ БРАУЗЕРА (LocalStorage) ---
        function saveData() {
            const rows = tableBody.querySelectorAll('tr');
            const data = [];

            rows.forEach(row => {
                data.push({
                    date: row.cells[0].textContent,
                    income: row.cells[1].textContent,
                    expense: row.cells[2].textContent,
                    comment: row.cells[3].textContent
                });
            });

            localStorage.setItem('papaBankData', JSON.stringify(data));
        }

        // Загрузка данных при открытии сайта
        function loadData() {
            const savedData = localStorage.getItem('papaBankData');
            
            if (savedData) {
                const data = JSON.parse(savedData);
                data.forEach(rowData => createRow(rowData));
            } else {
                // Если данных нет, создаем 10 пустых строк для начала
                for (let i = 0; i < 10; i++) {
                    createRow();
                }
            }
            calculateTotals(); // Считаем итоги после загрузки
        }

        // Запускаем загрузку при старте
        loadData();

    </script>
</body>
</html>
